name: Build & Push (dev)

# Mỗi lần push code lên nhánh dev -> build image mới, push lên Docker Hub.
on:
  push:
    branches: [dev]

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tạo tag: 'dev' (di động) + 'dev-<run_number>-<sha ngắn>' (cố định mỗi lần build)
      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=dev-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ricotdin:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/ricotdin:${{ steps.meta.outputs.version }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Cache layer giữa các lần build cho nhanh
          cache-from: type=gha
          cache-to: type=gha,mode=max
