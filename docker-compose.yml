# Run with:  docker compose --env-file .env.local up --build -d
#
# The --env-file flag makes Compose read .env.local for ${VAR} substitution
# in this file (used by build.args below).  Without it the NEXT_PUBLIC_*
# warnings appear and the bundle is built with empty strings.
#
# .env.local also supplies server-only secrets to the container at runtime
# via the service-level env_file below.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be inlined at build time — read from .env.local
        # via the --env-file flag on the docker compose command.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3333:3333"
    env_file:
      - .env.local    # server-only secrets injected at runtime, never baked in
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/"]
      interval: 30s
      timeout: 5s
      start_period: 35s
      retries: 3
